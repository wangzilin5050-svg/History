<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blooket Gold Quest: 历史金币大冒险</title>
  <style>
    :root {
      --primary: #3b82f6;
      --primary-dark: #1d4ed8;
      --gold: #fbbf24;
      --gold-dark: #d97706;
      --gold-deep: #b45309;
      --success: #10b981;
      --success-dark: #047857;
      --danger: #ef4444;
      --danger-dark: #b91c1c;
      --purple: #8b5cf6;
      --purple-dark: #6d28d9;
      --bg-sky: #38bdf8;
      --card-bg: #ffffff;
      --text-main: #1f2937;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: radial-gradient(circle at 50% 20%, #60a5fa, #1e40af 90%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      color: var(--text-main);
      overflow-x: hidden;
    }

    /* Blooket Chunky 3D Button Style */
    .btn-3d {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 800;
      font-size: 1.15rem;
      padding: 14px 28px;
      border-radius: 18px;
      border: none;
      cursor: pointer;
      position: relative;
      transition: all 0.08s ease-in-out;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-3d:active {
      transform: translateY(6px);
    }

    .btn-gold {
      background: var(--gold);
      color: #78350f;
      box-shadow: 0 7px 0 var(--gold-dark), 0 12px 16px rgba(0,0,0,0.25);
    }
    .btn-gold:active {
      box-shadow: 0 1px 0 var(--gold-dark), 0 3px 6px rgba(0,0,0,0.2);
    }

    .btn-green {
      background: #34d399;
      color: #064e3b;
      box-shadow: 0 7px 0 var(--success-dark), 0 12px 16px rgba(0,0,0,0.25);
    }
    .btn-green:active {
      box-shadow: 0 1px 0 var(--success-dark), 0 3px 6px rgba(0,0,0,0.2);
    }

    .btn-purple {
      background: #a78bfa;
      color: #2e1065;
      box-shadow: 0 7px 0 var(--purple-dark), 0 12px 16px rgba(0,0,0,0.25);
    }
    .btn-purple:active {
      box-shadow: 0 1px 0 var(--purple-dark), 0 3px 6px rgba(0,0,0,0.2);
    }

    /* Main Container */
    .game-window {
      width: 100%;
      max-width: 820px;
      min-height: 560px;
      background: #f8fafc;
      border-radius: 28px;
      border: 8px solid #ffffff;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* Top HUD */
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px;
      background: #ffffff;
      border-bottom: 4px solid #e2e8f0;
    }

    .hud-left, .hud-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .blook-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #eff6ff;
      border: 3px solid #bfdbfe;
      padding: 6px 14px;
      border-radius: 16px;
      font-weight: 800;
      color: #1e40af;
    }

    .blook-avatar-small {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: #3b82f6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 3px 0 #1d4ed8;
    }

    .gold-counter {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fef3c7;
      border: 3px solid #fde68a;
      padding: 6px 16px;
      border-radius: 16px;
      font-size: 1.25rem;
      font-weight: 900;
      color: #92400e;
    }

    .coin-icon {
      display: inline-block;
      animation: coinBounce 1.5s infinite ease-in-out;
    }

    @keyframes coinBounce {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-4px) rotate(15deg); }
    }

    .streak-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #fee2e2;
      border: 3px solid #fecaca;
      padding: 6px 12px;
      border-radius: 16px;
      font-weight: 900;
      color: #b91c1c;
      font-size: 0.95rem;
    }

    .audio-btn {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      border: none;
      background: #f1f5f9;
      box-shadow: 0 4px 0 #cbd5e1;
      cursor: pointer;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.1s;
    }
    .audio-btn:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #cbd5e1;
    }

    /* Content Area */
    .game-content {
      flex: 1;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .screen {
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .screen.active {
      display: flex;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.92); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Start / Blook Picker Screen */
    .blook-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin: 24px 0;
      max-width: 520px;
      width: 100%;
    }

    .blook-card {
      background: #ffffff;
      border: 4px solid #cbd5e1;
      border-radius: 20px;
      padding: 14px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      box-shadow: 0 6px 0 #cbd5e1;
      transition: all 0.12s ease;
    }

    .blook-card:hover {
      transform: translateY(-4px);
      border-color: #60a5fa;
      box-shadow: 0 10px 0 #93c5fd;
    }

    .blook-card.selected {
      border-color: var(--primary);
      background: #eff6ff;
      box-shadow: 0 6px 0 var(--primary-dark);
      transform: translateY(2px);
    }

    .blook-emoji {
      font-size: 42px;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
    }

    .blook-name {
      font-size: 0.95rem;
      font-weight: 800;
      color: #334155;
    }

    /* Question Screen */
    .progress-bar-container {
      width: 100%;
      height: 12px;
      background: #e2e8f0;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 20px;
      border: 2px solid #cbd5e1;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #3b82f6);
      transition: width 0.3s ease;
    }

    .question-box {
      background: #ffffff;
      border: 4px solid #e2e8f0;
      border-radius: 22px;
      padding: 24px;
      width: 100%;
      box-shadow: 0 8px 0 #e2e8f0;
      margin-bottom: 24px;
      position: relative;
    }

    .question-category {
      display: inline-block;
      background: #dbeafe;
      color: #1d4ed8;
      font-size: 0.85rem;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 12px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .question-text {
      font-size: 1.35rem;
      font-weight: 800;
      line-height: 1.45;
      color: #1e293b;
      text-align: left;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      width: 100%;
    }

    .opt-btn {
      background: #ffffff;
      border: 4px solid #cbd5e1;
      border-radius: 18px;
      padding: 18px 20px;
      cursor: pointer;
      font-size: 1.1rem;
      font-weight: 800;
      color: #334155;
      box-shadow: 0 6px 0 #cbd5e1;
      transition: all 0.08s ease;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 76px;
    }

    .opt-btn:hover {
      border-color: #93c5fd;
      transform: translateY(-2px);
      box-shadow: 0 8px 0 #93c5fd;
    }

    .opt-btn:active {
      transform: translateY(6px);
      box-shadow: 0 0 0 #cbd5e1;
    }

    .opt-badge {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: #f1f5f9;
      color: #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      flex-shrink: 0;
      border: 2px solid #cbd5e1;
    }

    /* Chest Screen (Gold Quest) */
    .chest-title {
      font-size: 2rem;
      font-weight: 900;
      color: #b45309;
      margin-bottom: 6px;
      text-shadow: 0 2px 0 #fde68a;
    }

    .chest-subtitle {
      font-size: 1.1rem;
      color: #64748b;
      font-weight: 700;
      margin-bottom: 30px;
    }

    .chests-container {
      display: flex;
      justify-content: center;
      gap: 28px;
      width: 100%;
      margin-bottom: 30px;
    }

    .chest-card {
      width: 160px;
      height: 180px;
      background: #ffffff;
      border: 5px solid var(--gold);
      border-radius: 24px;
      box-shadow: 0 10px 0 var(--gold-dark), 0 15px 25px rgba(0,0,0,0.15);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      animation: chestFloat 2s infinite ease-in-out;
    }

    .chest-card:nth-child(2) { animation-delay: 0.3s; }
    .chest-card:nth-child(3) { animation-delay: 0.6s; }

    @keyframes chestFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .chest-card:hover {
      transform: translateY(-12px) scale(1.05);
      box-shadow: 0 16px 0 var(--gold-dark), 0 20px 30px rgba(0,0,0,0.2);
    }

    .chest-card:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 var(--gold-dark);
    }

    .chest-icon {
      font-size: 64px;
      filter: drop-shadow(0 6px 6px rgba(0,0,0,0.15));
    }

    .chest-label {
      font-size: 1.1rem;
      font-weight: 900;
      color: #92400e;
    }

    /* Chest Reward Popup */
    .reward-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      backdrop-filter: blur(4px);
    }
    .reward-overlay.active {
      display: flex;
    }

    .reward-modal {
      background: #ffffff;
      border-radius: 28px;
      border: 8px solid var(--gold);
      padding: 36px 40px;
      text-align: center;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .reward-icon-huge {
      font-size: 80px;
      margin-bottom: 10px;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,0.2));
    }

    .reward-text-main {
      font-size: 2.2rem;
      font-weight: 900;
      color: #b45309;
      margin-bottom: 8px;
    }

    .reward-text-sub {
      font-size: 1.1rem;
      font-weight: 700;
      color: #475569;
      margin-bottom: 24px;
    }

    /* Incorrect Review Card */
    .review-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      backdrop-filter: blur(4px);
    }
    .review-overlay.active {
      display: flex;
    }

    .review-card {
      background: #ffffff;
      border-radius: 28px;
      border: 8px solid #f87171;
      padding: 32px;
      text-align: center;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      animation: popIn 0.3s ease;
    }

    .review-title {
      font-size: 1.8rem;
      font-weight: 900;
      color: #b91c1c;
      margin-bottom: 8px;
    }

    .review-explanation {
      background: #fef2f2;
      border: 2px dashed #fca5a5;
      border-radius: 16px;
      padding: 16px;
      font-size: 1.05rem;
      font-weight: 700;
      color: #991b1b;
      margin: 16px 0 24px;
      line-height: 1.5;
      text-align: left;
    }

    /* Final Screen */
    .win-badge {
      font-size: 76px;
      margin-bottom: 8px;
      animation: coinBounce 2s infinite ease-in-out;
    }

    .win-title {
      font-size: 2.4rem;
      font-weight: 900;
      color: #1e3a8a;
      margin-bottom: 4px;
    }

    .win-rank {
      font-size: 1.3rem;
      font-weight: 800;
      color: #d97706;
      background: #fef3c7;
      border: 3px solid #fde68a;
      padding: 6px 20px;
      border-radius: 20px;
      margin-bottom: 24px;
      display: inline-block;
    }

    .stats-summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      width: 100%;
      max-width: 520px;
      margin-bottom: 28px;
    }

    .stat-pill {
      background: #ffffff;
      border: 4px solid #e2e8f0;
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 5px 0 #e2e8f0;
    }

    .stat-val {
      font-size: 1.6rem;
      font-weight: 900;
      color: #1e293b;
    }

    .stat-lbl {
      font-size: 0.85rem;
      font-weight: 700;
      color: #64748b;
      margin-top: 4px;
    }

    /* Floating Coin particles */
    .coin-particle {
      position: absolute;
      pointer-events: none;
      font-size: 24px;
      animation: floatUp 1s forwards ease-out;
      z-index: 100;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translate(0, 0) scale(1); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.5); }
    }

    @media (max-width: 640px) {
      .game-window {
        border-radius: 20px;
        min-height: 600px;
      }
      .options-grid {
        grid-template-columns: 1fr;
      }
      .blook-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .chests-container {
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .chest-card {
        width: 100%;
        max-width: 260px;
        height: 110px;
        flex-direction: row;
      }
      .chest-icon {
        font-size: 44px;
      }
      .stats-summary {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="game-window">
    <!-- Top HUD Bar -->
    <div class="hud">
      <div class="hud-left">
        <div class="blook-badge">
          <div class="blook-avatar-small" id="hudAvatar">🦊</div>
          <span id="hudBlookName">小狐狸</span>
        </div>
        <div class="streak-badge" id="hudStreakBadge">
          🔥 <span id="hudStreak">0</span> 连胜
        </div>
      </div>
      <div class="hud-right">
        <div class="gold-counter">
          <span class="coin-icon">🟡</span>
          <span id="hudGold">0</span>
        </div>
        <button class="audio-btn" id="audioToggleBtn" title="切换音乐">🔊</button>
      </div>
    </div>

    <!-- Main Screens Content -->
    <div class="game-content">
      
      <!-- Screen 1: Start & Avatar Selection -->
      <div class="screen active" id="screenStart">
        <div style="font-size: 54px; margin-bottom: 8px;">👑</div>
        <h1 style="font-size: 2.2rem; font-weight: 900; color: #1e3a8a; margin-bottom: 6px;">GOLD QUEST</h1>
        <p style="font-size: 1.1rem; font-weight: 700; color: #475569; margin-bottom: 14px;">马来西亚历史评估 · 完整金币夺宝试炼</p>
        
        <p style="font-weight: 800; color: #64748b; font-size: 0.95rem;">选择你的金币探索角色 (Blook)：</p>
        <div class="blook-grid" id="blookPicker">
          <!-- Populated by JS -->
        </div>

        <button class="btn-3d btn-gold" id="btnStartGame" style="width: 240px;">开始探险 ➔</button>
      </div>

      <!-- Screen 2: Question View -->
      <div class="screen" id="screenQuestion">
        <div class="progress-bar-container">
          <div class="progress-bar-fill" id="progressBar"></div>
        </div>

        <div class="question-box">
          <div class="question-category" id="qCategory">历史常识</div>
          <div class="question-text" id="qText">题目内容加载中...</div>
        </div>

        <div class="options-grid" id="qOptions">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- Screen 3: Mystery Chest Selection -->
      <div class="screen" id="screenChest">
        <div class="chest-title">回答正确！🎉</div>
        <div class="chest-subtitle">挑选一个神秘宝箱，开出惊喜金币！</div>

        <div class="chests-container">
          <div class="chest-card" onclick="openChest(0)">
            <div class="chest-icon">🎁</div>
            <div class="chest-label">1 号宝箱</div>
          </div>
          <div class="chest-card" onclick="openChest(1)">
            <div class="chest-icon">🎁</div>
            <div class="chest-label">2 号宝箱</div>
          </div>
          <div class="chest-card" onclick="openChest(2)">
            <div class="chest-icon">🎁</div>
            <div class="chest-label">3 号宝箱</div>
          </div>
        </div>
        <div style="font-weight: 800; color: #94a3b8; font-size: 0.95rem;">连胜越高，宝箱奖励金币越多哦！</div>
      </div>

      <!-- Screen 4: Final Win Screen -->
      <div class="screen" id="screenFinal">
        <div class="win-badge">🏆</div>
        <div class="win-title">试炼完成！</div>
        <div class="win-rank" id="winTitleBadge">👑 历史金币大亨</div>

        <div class="stats-summary">
          <div class="stat-pill">
            <div class="stat-val" id="finalGold" style="color: #d97706;">0</div>
            <div class="stat-lbl">累计金币</div>
          </div>
          <div class="stat-pill">
            <div class="stat-val" id="finalAccuracy" style="color: #059669;">100%</div>
            <div class="stat-lbl">答题正确率</div>
          </div>
          <div class="stat-pill">
            <div class="stat-val" id="finalChests" style="color: #7c3aed;">0</div>
            <div class="stat-lbl">开启宝箱数</div>
          </div>
        </div>

        <button class="btn-3d btn-green" id="btnRestart">再玩一次 ↺</button>
      </div>

      <!-- Overlay: Chest Reward -->
      <div class="reward-overlay" id="rewardOverlay">
        <div class="reward-modal">
          <div class="reward-icon-huge" id="rewardIcon">💰</div>
          <div class="reward-text-main" id="rewardAmount">+150 金币</div>
          <div class="reward-text-sub" id="rewardDesc">财源滚滚！金币直线上升！</div>
          <button class="btn-3d btn-gold" id="btnNextQuestion" style="width: 100%;">下一题 ➔</button>
        </div>
      </div>

      <!-- Overlay: Incorrect Review Card -->
      <div class="review-overlay" id="reviewOverlay">
        <div class="review-card">
          <div style="font-size: 54px; margin-bottom: 6px;">💡</div>
          <div class="review-title">哎呀，差一点！</div>
          <p style="font-weight: 700; color: #64748b;">别灰心，牢记这个重要知识点：</p>
          <div class="review-explanation" id="reviewText">
            正确答案解析加载中...
          </div>
          <button class="btn-3d btn-purple" id="btnReviewContinue" style="width: 100%;">继续挑战 ➔</button>
        </div>
      </div>

    </div>
  </div>

  <script>
    /* ==========================================================================
       1. QUESTION BANK (Full History Exam Paper - No Soalan/Bahagian mention)
       ========================================================================== */
    const QUESTION_BANK = [
      {
        category: "君主制度",
        question: "下列哪些国家在如今依然保存着君主制度？",
        options: ["泰国 与 文莱", "泰国 与 印度尼西亚", "新加坡 与 登嘉楼", "新加坡 与 印度尼西亚"],
        correct: 0,
        explanation: "泰国和文莱在现今仍然保存着君主制度；新加坡与印度尼西亚则为共和国制度。"
      },
      {

          g.connect(this.ctx.destination);
          osc.start(now + i * 0.08);
          osc.stop(now + i * 0.08 + 0.25);
        });
      }

      // SFX: Game Victory Fanfare
      playVictory() {
        if (this.isMuted) return;
        this.init();
        const now = this.ctx.currentTime;
        const notes = [
          { f: 523.25, d: 0.15 }, { f: 523.25, d: 0.15 }, { f: 523.25, d: 0.15 },
          { f: 659.25, d: 0.35 }, { f: 587.33, d: 0.15 }, { f: 659.25, d: 0.15 },
          { f: 783.99, d: 0.6 }
        ];
        let t = now;
        notes.forEach(n => {
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(n.f, t);
          g.gain.setValueAtTime(0.45, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + n.d);
          osc.connect(g);
          g.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + n.d);
          t += n.d * 0.95;
        });
      }
    }

    const sound = new SoundEngine();

    /* ==========================================================================
       4. GAME STATE MANAGEMENT
       ========================================================================== */
    let selectedBlook = BLOOKS[0];
    let currentIndex = 0;
    let gold = 0;
    let streak = 0;
    let correctCount = 0;
    let chestsOpened = 0;
    let shuffledQuestions = [];

    // Initialize UI Elements
    const screenStart = document.getElementById('screenStart');
    const screenQuestion = document.getElementById('screenQuestion');
    const screenChest = document.getElementById('screenChest');
    const screenFinal = document.getElementById('screenFinal');

    const blookPicker = document.getElementById('blookPicker');
    const hudAvatar = document.getElementById('hudAvatar');
    const hudBlookName = document.getElementById('hudBlookName');
    const hudGold = document.getElementById('hudGold');
    const hudStreak = document.getElementById('hudStreak');
    const audioToggleBtn = document.getElementById('audioToggleBtn');

    const rewardOverlay = document.getElementById('rewardOverlay');
    const reviewOverlay = document.getElementById('reviewOverlay');

    // Build Character Picker
    function renderBlookPicker() {
      blookPicker.innerHTML = '';
      BLOOKS.forEach((b, index) => {
        const card = document.createElement('div');
        card.className = `blook-card ${index === 0 ? 'selected' : ''}`;
        card.innerHTML = `
          <div class="blook-emoji">${b.emoji}</div>
          <div class="blook-name">${b.name}</div>
        `;
        card.onclick = () => {
          document.querySelectorAll('.blook-card').forEach(c => c.classList.remove('selected'));
          card.classList.add('selected');
          selectedBlook = b;
          hudAvatar.innerText = b.emoji;
          hudBlookName.innerText = b.name;
        };
        blookPicker.appendChild(card);
      });
    }

    function switchScreen(screen) {
      [screenStart, screenQuestion, screenChest, screenFinal].forEach(s => s.classList.remove('active'));
      screen.classList.add('active');
    }

    function shuffleArray(arr) {
      return [...arr].sort(() => Math.random() - 0.5);
    }

    function updateHUD() {
      hudGold.innerText = gold.toLocaleString();
      hudStreak.innerText = streak;
    }

    function spawnCoinParticles(targetEl) {
      const rect = targetEl.getBoundingClientRect();
      for (let i = 0; i < 8; i++) {
        const coin = document.createElement('div');
        coin.className = 'coin-particle';
        coin.innerText = '🟡';
        coin.style.left = `${rect.left + rect.width / 2 + (Math.random() * 40 - 20)}px`;
        coin.style.top = `${rect.top + (Math.random() * 20 - 10)}px`;
        coin.style.setProperty('--dx', `${(Math.random() - 0.5) * 120}px`);
        coin.style.setProperty('--dy', `${-(Math.random() * 100 + 40)}px`);
        document.body.appendChild(coin);
        setTimeout(() => coin.remove(), 1000);
      }
    }

    /* ==========================================================================
       5. GAME FLOW
       ========================================================================== */
    function startGame() {
      sound.init();
      sound.startBGM();
      gold = 0;
      streak = 0;
      currentIndex = 0;
      correctCount = 0;
      chestsOpened = 0;
      shuffledQuestions = shuffleArray(QUESTION_BANK);

      hudAvatar.innerText = selectedBlook.emoji;
      hudBlookName.innerText = selectedBlook.name;
      updateHUD();

      switchScreen(screenQuestion);
      loadQuestion();
    }

    function loadQuestion() {
      if (currentIndex >= shuffledQuestions.length) {
        showFinalScreen();
        return;
      }

      const q = shuffledQuestions[currentIndex];
      const progressPercent = (currentIndex / shuffledQuestions.length) * 100;
      document.getElementById('progressBar').style.width = `${progressPercent}%`;

      document.getElementById('qCategory').innerText = q.category;
      document.getElementById('qText').innerText = q.question;

      const optContainer = document.getElementById('qOptions');
      optContainer.innerHTML = '';

      // Shuffle options to keep game unpredictable
      const optionObjs = q.options.map((text, idx) => ({ text, isCorrect: idx === q.correct }));
      const shuffledOptions = shuffleArray(optionObjs);

      const letterTags = ['A', 'B', 'C', 'D'];
      shuffledOptions.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerHTML = `
          <div class="opt-badge">${letterTags[idx]}</div>
          <div style="flex:1;">${opt.text}</div>
        `;
        btn.onclick = () => handleAnswer(opt.isCorrect, q);
        optContainer.appendChild(btn);
      });
    }

    function handleAnswer(isCorrect, questionData) {
      if (isCorrect) {
        sound.playCorrect();
        streak++;
        correctCount++;
        updateHUD();
        switchScreen(screenChest);
      } else {
        sound.playIncorrect();
        streak = 0;
        updateHUD();
        // Show Review Card before continuing
        document.getElementById('reviewText').innerText = questionData.explanation;
        reviewOverlay.classList.add('active');
      }
    }

    /* Mystery Chest Outcomes (Blooket Style) */
    function openChest(chestIndex) {
      sound.playChestOpen();
      chestsOpened++;
      const streakMultiplier = 1 + (streak * 0.15); // reward consecutive answers

      // Random Pool of outcomes
      const outcomes = [
        { type: 'gold', val: Math.round(50 * streakMultiplier), text: `+${Math.round(50 * streakMultiplier)} 金币`, desc: "不错的手气！收获了一袋金币！", icon: "💰" },
        { type: 'gold', val: Math.round(120 * streakMultiplier), text: `+${Math.round(120 * streakMultiplier)} 金币`, desc: "金光闪闪！大笔财富入账！", icon: "🪙" },
        { type: 'gold', val: Math.round(250 * streakMultiplier), text: `+${Math.round(250 * streakMultiplier)} 金币`, desc: "超级大宝藏！发家致富！", icon: "💎" },
        { type: 'mega', val: Math.round(500 * streakMultiplier), text: `+${Math.round(500 * streakMultiplier)} MEGA 金币!`, desc: "运气爆棚！挖到了传说中的金矿！", icon: "👑" },
        { type: 'double', text: "金币翻倍 2X!", desc: "魔法宝箱让你的金币翻了一整倍！", icon: "⚡" },
        { type: 'prank', text: "恶作剧炸弹! -15%", desc: "哎呀！被调皮鬼偷吃了 15% 的金币！", icon: "💣" }
      ];

      // Give higher gold chances
      const roll = Math.random();
      let picked;
      if (gold > 300 && roll < 0.15) {
        picked = outcomes[5]; // Prank Bomb
      } else if (roll < 0.18) {
        picked = outcomes[4]; // Double 2X
      } else if (roll < 0.35) {
        picked = outcomes[3]; // Mega 500
      } else if (roll < 0.65) {
        picked = outcomes[2]; // 250
      } else if (roll < 0.88) {
        picked = outcomes[1]; // 120
      } else {
        picked = outcomes[0]; // 50
      }

      // Apply logic
      if (picked.type === 'double') {
        gold = gold === 0 ? 100 : gold * 2;
        sound.playCheer();
      } else if (picked.type === 'prank') {
        const loss = Math.round(gold * 0.15);
        gold = Math.max(0, gold - loss);
      } else {
        gold += picked.val;
      }

      updateHUD();
      spawnCoinParticles(screenChest);

      // Display Modal
      document.getElementById('rewardIcon').innerText = picked.icon;
      document.getElementById('rewardAmount').innerText = picked.text;
      document.getElementById('rewardDesc').innerText = picked.desc;
      rewardOverlay.classList.add('active');
    }

    function advanceToNextQuestion() {
      rewardOverlay.classList.remove('active');
      reviewOverlay.classList.remove('active');
      currentIndex++;
      switchScreen(screenQuestion);
      loadQuestion();
    }

    function showFinalScreen() {
      sound.stopBGM();
      sound.playVictory();

      const accuracy = Math.round((correctCount / shuffledQuestions.length) * 100);
      document.getElementById('finalGold').innerText = gold.toLocaleString();
      document.getElementById('finalAccuracy').innerText = `${accuracy}%`;
      document.getElementById('finalChests').innerText = chestsOpened;

      // Assign fun Blooket title
      const titleBadge = document.getElementById('winTitleBadge');
      if (gold >= 5000) {
        titleBadge.innerText = "👑 传奇历史金币神豪";
      } else if (gold >= 2500) {
        titleBadge.innerText = "💎 资深皇家大探险家";
      } else if (gold >= 1000) {
        titleBadge.innerText = "🪙 历史淘金高手";
      } else {
        titleBadge.innerText = "🌱 勤奋历史小学徒";
      }

      switchScreen(screenFinal);
    }

    /* ==========================================================================
       6. EVENT LISTENERS
       ========================================================================== */
    document.getElementById('btnStartGame').onclick = startGame;
    document.getElementById('btnNextQuestion').onclick = advanceToNextQuestion;
    document.getElementById('btnReviewContinue').onclick = advanceToNextQuestion;
    document.getElementById('btnRestart').onclick = () => {
      switchScreen(screenStart);
    };

    audioToggleBtn.onclick = () => {
      const active = sound.toggleAudio();
      audioToggleBtn.innerText = active ? "🔊" : "🔇";
    };

    // Initialize Picker
    renderBlookPicker();
  </script>
</body>
</html>
